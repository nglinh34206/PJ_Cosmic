<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Base - Thư viện tài liệu</title>
 <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
        <link rel="stylesheet" href="hiệu chỉnh.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="main-content" style="width: 100%; margin: 0; padding: 20px;">
        
        <div id="list-view-wrapper">
            
            <div id="resource-hub-main" class="view-section active">
                <div class="blob-wrapper" style="text-align: center;">
                    <h1 style="color: #00DDEB; margin-bottom: 5px;">KHO TÀI LIỆU</h1>
                    <p class="subtitle" style="margin-bottom: 0;">Nhớ điền form bên dưới để nhận thêm tài liệu nhé!!</p>
<div style="display: flex; justify-content: flex-end; max-width: 800px; margin: 0 auto; padding-right: 15px;">
    <button onclick="openGlobalFeedback()" style="background: rgba(0, 221, 235, 0.1); border: 1.5px solid var(--neon-cyan, #00DDEB); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 8px rgba(0, 221, 235, 0.3); transition: all 0.3s ease; display: flex; align-items: center; gap: 5px;">
        <span style="font-size: 1rem;">📮</span> Góp ý tài liệu
    </button>
</div>
            </div>
</div>
            <div id="resource-list-container" class="resource-list" style="display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto 40px auto;">
                </div>
                
            <div style="position: relative; text-align: center;">
                <h3 style="color: var(--neon-cyan); font-size: 1.1rem; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;">
                    🚀 Siêu trợ thủ Cosmic sắp ra mắt
                </h3>
                <p style="color: #ffffff; font-size: 1.6rem; font-weight: bold; margin: 0; text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); font-style: italic;">
                    "Giảm bớt lo âu, đón đầu bứt phá"
                </p>
                <div style="position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; background: var(--neon-purple); filter: blur(30px); opacity: 0.6; z-index: -1;"></div>
                <div style="position: absolute; bottom: -20px; left: -20px; width: 60px; height: 60px; background: var(--neon-cyan); filter: blur(30px); opacity: 0.4; z-index: -1;"></div>
            </div>

        </div> 
        <div id="inline-viewer-container" style="position: relative; display: none; margin-top: 20px; margin-bottom: 40px; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 80vh; border: 1px solid var(--neon-cyan); border-radius: 15px; overflow: hidden; background: var(--cosmo-dark); flex-direction: column; box-shadow: 0 0 20px rgba(0, 221, 235, 0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--neon-cyan);">
                <h2 id="inline-doc-title" style="color: var(--neon-cyan); margin: 0; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%;">Tên tài liệu</h2>
                
                <div id="vote-buttons" style="display: flex; gap: 10px; align-items: center;">
                    <button onclick="voteDoc('like')" style="background: rgba(0, 221, 235, 0.1); border: 1px solid var(--neon-cyan); color: #fff; padding: 4px 15px; border-radius: 20px; cursor: pointer;">👍 Hữu ích</button>
                    <button onclick="voteDoc('dislike')" style="background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; color: #fff; padding: 4px 15px; border-radius: 20px; cursor: pointer;">👎 Chưa ổn</button>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="shareDocument()" style="background: rgba(0, 221, 235, 0.2); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">🔗 Chia sẻ</button>
                    <button onclick="closeDocument()" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Đóng X</button>
                </div>
            </div>


<div id="doc-feedback-panel" style="display: none; position: absolute; right: 0; top: 55px; bottom: 0; width: 320px; background: rgba(10, 14, 23, 0.95); border-left: 1px solid #00DDEB; backdrop-filter: blur(10px); padding: 15px; flex-direction: column; z-index: 10; box-shadow: -5px 0 15px rgba(0,0,0,0.5);">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 221, 235, 0.3); padding-bottom: 10px; margin-bottom: 15px;">
        <h4 style="color: #00DDEB; margin: 0;">🛰️ Góp ý </h4>
        <button onclick="document.getElementById('doc-feedback-panel').style.display='none'" style="background: transparent; color: #ff4d4d; border: none; cursor: pointer; font-size: 1.2rem;">✕</button>
    </div>

    <div id="doc-feedback-content" style="flex: 1; overflow-y: auto; color: #fff; font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px;">
        </div>
</div>
            <iframe id="inline-doc-iframe" style="width: 100%; flex-grow: 1; border: none; background: #fff;"></iframe>
        </div>
            
        </div>
        <div id="split-view-container" style="display: none; height: 90vh; flex-direction: column;">
            <div class="doc-viewer-header" style="background: #1C2438; padding: 15px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between;">
                <h3 id="doc-title" style="color: #E0FFFF; margin: 0;">Tên tài liệu</h3>
                <button onclick="closeDocument()" style="background: #FF4500; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer;">Đóng ✖</button>
            </div>
            
            <div class="doc-content-placeholder" style="flex: 1; background: #0A0E17;">
                <iframe id="doc-iframe" class="doc-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="main.js"></script>
    <div id="global-feedback-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
    
    <div style="background: #0A0E17; border: 1px solid #00DDEB; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(0, 221, 235, 0.2); overflow: hidden; display: flex; flex-direction: column;">
        
        <div style="padding: 15px 20px; border-bottom: 1px solid rgba(0, 221, 235, 0.3); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 221, 235, 0.1);">
            <h3 style="margin: 0; color: #00DDEB; font-size: 1.2rem;">🛸 TRẠM THU THẬP BÁO CÁO ẨN DANH</h3>
            <button onclick="closeGlobalFeedback()" style="background: none; border: none; color: #ff4d4d; font-size: 1.5rem; cursor: pointer;">✕</button>
        </div>

        <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;"> 
            <p style="color: #aaa; margin: 0; font-size: 0.9rem;">Bạn phát hiện lỗi gì thì báo ngay cho Cosmic nhé. Mọi thông tin đều được bảo mật 100%</p>
            
            <div style="display: flex; gap: 10px;">
               <input list="subject-list" id="global-input-subject" placeholder="-- Nhập mã hoặc tên môn --" style="flex: 1; padding: 10px; border-radius: 8px; background: #1C2438; color: white; border: 1px solid #00DDEB; outline: none;">

<datalist id="subject-list">
    <option value="QTH - Quản trị học"></option>
    <option value="MKT - Marketing"></option>
    <option value="HVTC - Hành vi tổ chức"></option>
    <option value="TCDN - Tài chính doanh nghiệp"></option>
    <option value="NHTM - Ngân hàng thương mại"></option>
    <option value="PTTKHT - Phân tích thiết kế hệ thống"></option>
    <option value="QLDACNTT - Quản lý dự án CNTT"></option>
    <option value="TTNT - Trí tuệ nhân tạo"></option>
    <option value="TTCN - Thực tập chuyên ngành"></option>
    <option value="LTW - Lập trình Web với Php và MySQL"></option>
    <option value="BA - Phân tích nghiệp vụ"></option>
    <option value="KDL - Kho dữ liệu và kinh doanh thông minh"></option>
    <option value="ERP - Hệ thống hoạch định tài nguyên DN"></option>
    <option value="CNDVTC - Công nghệ dịch vụ tài chính"></option>
    <option value="HTTTNH - Các HTTT trong ngân hàng"></option>
    <option value="CNNHS - Công nghệ ngân hàng số"></option>
    <option value="KLTN - Tốt nghiệp (8 tín chỉ)"></option>
    <option value="DATN - Đồ án tốt nghiệp"></option>
    <option value="TA4 - Tiếng Anh IV"></option>
    <option value="NMHTTT - Nhập môn hệ thống thông tin"></option>
    <option value="CSLT - Cơ sở lập trình"></option>
    <option value="CSDL - Cơ sở dữ liệu"></option>
    <option value="NLKT - Nguyên lý kế toán"></option>
    <option value="KTH - Kinh tế học"></option>
    <option value="CTDLGT - Cấu trúc dữ liệu và giải thuật"></option>
    <option value="TKCSDL - Thiết kế cơ sở dữ liệu"></option>
    <option value="TRR - Toán rời rạc"></option>
    <option value="HQTCSDL - Hệ quản trị cơ sở dữ liệu"></option>
    <option value="TMDT - Thương mại điện tử"></option>
    <option value="TKW - Thiết kế Web"></option>
    <option value="HTTTQL - Hệ thống thông tin quản lý"></option>
    <option value="MVTT - Mạng và truyền thông"></option>
    <option value="LTNET - Lập trình .NET"></option>
    <option value="KPDL - Khai phá và phân tích dữ liệu"></option>
    <option value="THML - Triết học Mác - Lênin"></option>
    <option value="KTCT - Kinh tế chính trị Mác - Lênin"></option>
    <option value="CNXHKH - Chủ nghĩa xã hội khoa học"></option>
    <option value="LSD - Lịch sử Đảng Cộng sản Việt Nam"></option>
    <option value="TTHCM - Tư tưởng Hồ Chí Minh"></option>
    <option value="TA1 - Tiếng Anh I"></option>
    <option value="TA2 - Tiếng Anh II"></option>
    <option value="TA3 - Tiếng Anh III"></option>
    <option value="NLS - Năng lực số ứng dụng"></option>
    <option value="PLDC - Pháp luật đại cương"></option>
    <option value="TKT - Toán dành cho kinh tế"></option>
    <option value="XSTK - Xác suất và thống kê"></option>
    <option value="GTTKD - Giao tiếp trong kinh doanh"></option>
    <option value="DMST - Đổi mới sáng tạo và khởi nghiệp"></option>
    <option value="TOEIC - Chứng chỉ TOEIC"></option>
    <option value="MOS - Chứng chỉ MOS"></option>
    <option value="TLDB - Tài liệu đặc biệt"></option>
</datalist>
                
                <select id="global-input-doctype" style="flex: 1; padding: 10px; border-radius: 8px; background: #1C2438; color: white; border: 1px solid #00DDEB; outline: none;">
                    <option value="">-- Phân loại --</option>
                    <option value="TQ">Tổng quát</option>
                    <option value="SOS">Tài liệu khẩn</option>
                    <option value="EXAM">Đề thi</option>
                </select>
            </div>

            <textarea id="global-input-content" rows="4" placeholder="Nhập chi tiết yêu cầu hoặc lỗi bạn gặp phải ở đây..." style="width: 100%; padding: 10px; border-radius: 8px; background: #1C2438; color: white; border: 1px solid #00DDEB; outline: none; resize: none; font-family: inherit; box-sizing: border-box;"></textarea>
            
            <button onclick="submitGlobalFeedback(this)" style="background: #00DDEB; color: black; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 5px; transition: 0.3s;">🚀Gửi yêu cầu lên tổng bộ</button>
        </div>
    </div>
</div>
</body>
</html>
